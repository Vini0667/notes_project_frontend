# Compose file for development frontend service

services:
    frontend:
        build:
            context: .
            dockerfile: Dockerfile-dev
            target: react-dev
        ports:
            - "3000:3000"
        volumes:
            - .:/app
        tty: true
        stdin_open: true
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
                max_attempts: 3
                delay: 10s
            resources:
                limits:
                    memory: 512M
                    cpus: "0.5"
                reservations:
                    memory: 256M
                    cpus: "0.25"

    cypress-test:
        build:
            context: .
            dockerfile: Dockerfile-dev
            target: cypress_runner